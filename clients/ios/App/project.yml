name: JuNotes
options:
  bundleIdPrefix: app.junotes
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
packages:
  JuNotesCore:
    path: ../JuNotesCore
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  JuNotes:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: JuNotesCore
      - package: ZIPFoundation
    info:
      path: Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [app.junotes.refresh]
        UIBackgroundModes: [fetch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.junotes.ios
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JuNotes
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_NSCameraUsageDescription: JuNotes scannt Arbeitsblätter und Hefte mit der Kamera ab.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: JuNotes nimmt auf, wenn du eine Sprachaufnahme zu einer Seite machst.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: JuNotes fügt Fotos aus deiner Mediathek in Seiten und Cover ein.
        INFOPLIST_KEY_NSFaceIDUsageDescription: JuNotes fragt nach Face ID, um gesperrte Hefte zu öffnen.
schemes:
  JuNotes:
    build:
      targets:
        JuNotes: all
