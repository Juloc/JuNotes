name: Server

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "database/**", "*.slnx", "*.props", "global.json", ".github/workflows/server.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "database/**", "*.slnx", "*.props", "global.json", ".github/workflows/server.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: junotes_test
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: junotes_test_admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U junotes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build JuNotes.slnx -c Release --nologo
      - run: dotnet test tests/JuNotes.Backend.Tests -c Release --no-build --nologo
        env:
          JUNOTES_TEST_DB: Host=localhost;Port=5432;Username=junotes_test;Password=isolated-test-password;Database=junotes_test_admin
