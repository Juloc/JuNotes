name: iPad app

on:
  push:
    branches: [main]
    paths: ["clients/ios/**", "scripts/build-ipa.sh", "scripts/screenshots.sh", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["clients/ios/**", "scripts/build-ipa.sh", "scripts/screenshots.sh", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every build is a new version, so SideStore sees an update.
  JUNOTES_VERSION: 0.1.${{ github.run_number }}
  JUNOTES_BUILD: ${{ github.run_number }}

jobs:
  build:
    # The runner image that carries Xcode 27 (Swift 6.4); macos-latest still has Xcode 26.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode
        run: |
          latest="$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          swift --version
      - name: Core tests
        run: swift test
        working-directory: clients/ios/JuNotesCore
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned IPA
        run: scripts/build-ipa.sh "$RUNNER_TEMP/ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: JuNotes-unsigned-ipa
          path: ${{ runner.temp }}/ipa/JuNotes.ipa
          retention-days: 14

  screenshots:
    # The real app in the iPad simulator, with made-up data, as pictures to look at.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode
        run: |
          latest="$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run the app and take screenshots
        run: scripts/screenshots.sh "$RUNNER_TEMP/screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JuNotes-screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          retention-days: 14

  publish:
    # The newest build as a download and as a source for SideStore, from the "latest" release of this repository.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: JuNotes-unsigned-ipa
          path: ipa
      - name: Write the SideStore source
        run: scripts/make-source.sh ipa/JuNotes.ipa "$JUNOTES_VERSION" "${{ github.repository }}" ipa/source.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Version $JUNOTES_VERSION, gebaut aus ${GITHUB_SHA::7}. Unsigniert: mit iloader oder SideStore auf dem iPad installieren."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$notes" --title "JuNotes (neueste Version)"
          else
            gh release create latest --notes "$notes" --title "JuNotes (neueste Version)" --prerelease
          fi
          gh release upload latest ipa/JuNotes.ipa ipa/source.json --clobber
