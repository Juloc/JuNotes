name: Container

# Builds the server image. A tag vX.Y.Z publishes ghcr.io/juloc/notes:X.Y.Z (no "latest");
# the tests run in the workflow "Server" on every push to main.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (version tag only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/juloc/notes:${{ steps.version.outputs.value }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
