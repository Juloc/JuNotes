name: Container

# Builds the server image. A tag vX.Y.Z publishes ghcr.io/juloc/notes:X.Y.Z (no "latest");
# the tests run in the workflow "Server" on every push to main.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          code=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props | head -1)
          [ "$version" = "$code" ] || { echo "tag $version, but Directory.Build.props says $code"; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (version tag only)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: COMMIT=${{ github.sha }}
          tags: ghcr.io/juloc/notes:${{ steps.version.outputs.value }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
