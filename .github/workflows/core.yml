name: Core (Linux)

on:
  push:
    branches: [main]
    paths: ["clients/ios/JuNotesCore/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["clients/ios/JuNotesCore/**", ".github/workflows/core.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: clients/ios/JuNotesCore
