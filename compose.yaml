# JuNotes: the server and its PostgreSQL. Copy .env.example to .env, fill it in, then `docker compose up -d`.
services:
  junotes:
    image: ${JUNOTES_IMAGE:-junotes:local}
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__JuNotes: Host=postgres;Database=junotes;Username=junotes;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      Sync__Token: ${SYNC_TOKEN:?set SYNC_TOKEN in .env}
      # Optional; empty means off. See the README for what each one does.
      School__TimetableIcsUrl: ${SCHOOL_TIMETABLE_ICS_URL:-}
      School__NewsFeedUrl: ${SCHOOL_NEWS_FEED_URL:-}
      School__Untis__Server: ${UNTIS_SERVER:-}
      School__Untis__School: ${UNTIS_SCHOOL:-}
      School__Untis__User: ${UNTIS_USER:-}
      School__Untis__Password: ${UNTIS_PASSWORD:-}
      Backup__CopyTo: ${BACKUP_COPY_TO:-}
      Backup__Passphrase: ${BACKUP_PASSPHRASE:-}
      Paperless__BaseUrl: ${PAPERLESS_BASE_URL:-}
      Paperless__Token: ${PAPERLESS_TOKEN:-}
    ports:
      - "127.0.0.1:8098:8080"
    volumes:
      - junotes-data:/data
    stop_grace_period: 20s

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: junotes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: junotes
    volumes:
      - junotes-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U junotes -d junotes"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  junotes-data:
  junotes-db:
